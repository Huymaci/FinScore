name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q --cov=app --cov-report=term-missing

  migrations-mysql:
    name: alembic upgrade head (real MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartfinance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # The three P0 incidents (Secure cookie, Decimal/float, VARCHAR overflow)
      # only reproduce on a strict-mode MySQL, never on the SQLite unit suite.
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/smartfinance?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/smartfinance?charset=utf8mb4
      SECRET_KEY: ci-not-a-real-secret
      ADMIN_EMAIL: admin@smartfinance.local
      ADMIN_PASSWORD: CiSeedPassw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Migrate from an empty database
        run: python -m alembic upgrade head
      - name: Fail if models drift from the migrations
        run: python -m alembic check
      - name: Seed reference data
        run: python -m scripts.seed
      - name: Migration tests against MySQL
        run: pytest -q tests/test_migrations.py
